[build-system]
requires = ["setuptools>=77"]   # SPDX license expression (PEP 639); supports Python 3.9
build-backend = "setuptools.build_meta"

[project]
name = "kinloom"
version = "1.0.0"
description = "Deep AI in any game, any engine, any model, in minutes: characters that talk, answer, decide, act and create."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["game", "ai", "llm", "npc", "godot", "unity", "procedural"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/KorroAi/kinloom"
Repository = "https://github.com/KorroAi/kinloom"
Changelog = "https://github.com/KorroAi/kinloom/blob/fresh/CHANGELOG.md"
Issues = "https://github.com/KorroAi/kinloom/issues"

[project.scripts]
kinloom = "kinloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinloom = ["clients/**/*", "kit/**/*", "dashboard.html", "talk.html"]

[tool.setuptools.exclude-package-data]
"*" = ["obj/*", "obj/*/*", "obj/*/*/*", "obj/*/*/*/*", "bin/*", "bin/*/*", "bin/*/*/*", "bin/*/*/*/*", "target/*", "target/*/*", "target/*/*/*", "target/*/*/*/*", "clients/*/obj/*", "clients/*/obj/*/*", "clients/*/obj/*/*/*", "clients/*/obj/*/*/*/*", "clients/*/bin/*", "clients/*/bin/*/*", "clients/*/bin/*/*/*", "clients/*/bin/*/*/*/*", "clients/*/target/*", "clients/*/target/*/*", "clients/*/target/*/*/*", "clients/*/target/*/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ollama: the test fakes a local Ollama itself"]
