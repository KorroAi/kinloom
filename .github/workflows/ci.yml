name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # release.yml runs it first: nothing is published unless every check passes

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install pytest
      - run: python -m pytest -q

  sdks:
    name: Every SDK (conformance)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Lua runtimes (lupa) and Godot
        run: |
          python -m pip install lupa
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Each client against a real kinloom serve
        run: python python/conformance/run.py
      - name: Each SDK's own brain against a fake model
        run: python python/conformance/native.py
      - name: Godot played with real key events (dialogue box, quitting during a request)
        run: python python/conformance/godot_ui.py

  package:
    name: Wheel and release zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist python
      - run: python python/release.py dist
      - name: The wheel installs and runs
        run: |
          python -m pip install dist/*.whl
          kinloom --version
          mkdir game && cd game && echo "print('game')" > main.py && kinloom init --yes
