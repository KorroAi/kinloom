<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinloom Talk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%237c9cff%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --line: #262b38; --text: #e6e8ef; --muted: #8b92a6; --soft: #1e2230;
    --accent: #7c9cff; --ok: #4fd1a5; --warn: #f5b04c; --bad: #ff6b81; --npc: #232839; --me: #3a4ea8;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7fb; --panel: #ffffff; --line: #e3e6ef; --text: #1b1f2a; --muted: #6a7185; --soft: #eef0f6;
            --accent: #4a6cf7; --npc: #eef0f6; --me: #4a6cf7; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; } h1 span { color: var(--accent); }
  header a { color: var(--muted); text-decoration: none; margin-left: auto; font-size: 13px; }
  .badge { padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
  .online { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .offline { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  #banner { display: none; margin: 12px 18px 0; padding: 10px 14px; border-radius: 8px; font-size: 13px;
            background: color-mix(in srgb, var(--warn) 14%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
  #banner code { background: var(--soft); padding: 1px 5px; border-radius: 4px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px 1fr 320px; gap: 14px; padding: 14px 18px; }
  @media (max-width: 1100px) { main { grid-template-columns: 260px 1fr; overflow: auto; } #soulcol { grid-column: 1 / -1; }
                               #talkcol { min-height: 72vh; } .col { overflow: visible; } }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
  .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: auto; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 10px; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
  input, textarea, select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
                            padding: 8px 10px; font: inherit; }
  textarea { resize: vertical; min-height: 64px; }
  button { background: var(--accent); color: white; border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--text); border: 1px solid var(--line); cursor: pointer; }
  .person { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .person:hover, .person.on { background: var(--soft); }
  .person b { display: block; } .person small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  #talkcol { display: flex; flex-direction: column; min-height: 0; padding: 0; }
  #who { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; min-height: 52px; }
  #who b { font-size: 16px; } #who .mood { margin-left: auto; }
  #log { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.npc { background: var(--npc); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.me { background: var(--me); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .note { align-self: center; font-size: 12px; color: var(--muted); }
  .note.act { color: var(--warn); font-weight: 600; }
  .typing::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #compose { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  #compose input { flex: 1; }
  .icon { background: var(--soft); color: var(--text); border: 1px solid var(--line); padding: 9px 11px; }
  .icon.on { background: var(--accent); color: white; }
  .mood { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--soft); }
  .bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; margin-top: 4px; position: relative; }
  .bar i { position: absolute; top: 0; bottom: 0; background: var(--accent); }
  .field { margin-bottom: 10px; } .field b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .field ul { margin: 2px 0 0; padding-left: 18px; }
  .secret { filter: blur(4px); cursor: pointer; transition: filter .2s; } .secret:hover { filter: none; }
  .empty { color: var(--muted); font-style: italic; font-size: 13px; }
  .mem { font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--line); } .mem:last-child { border: 0; }
  .writing { color: var(--accent); font-size: 12px; }
  .gesture { align-self: flex-start; font-size: 13px; font-style: italic; color: var(--muted); margin: -4px 0 0 6px; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; margin-top: 10px; }
  .check input { width: auto; }
  .saved { color: var(--ok); font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>
<header>
  <h1>Kinloom <span>Talk</span></h1>
  <span id="mode" class="badge offline">connecting…</span>
  <a href="/" id="dash">live dashboard →</a>
</header>
<div id="banner"></div>
<main>
  <div class="col">
    <section>
      <h2>New character</h2>
      <div class="chips" id="presets"></div>
      <label for="name">Name</label><input id="name" placeholder="Mira">
      <label for="soulseed">Who are they? One sentence is enough.</label>
      <textarea id="soulseed" placeholder="a widowed blacksmith, gruff and proud, who secretly sold the king's sword to pay her debts"></textarea>
      <label for="tools">What can they do in your game? (optional)</label>
      <input id="tools" placeholder="give(item), follow, refuse_service">
      <div class="row">
        <div style="flex:1"><label for="lang">Language</label><select id="lang"></select></div>
        <div style="flex:1"><label for="me">Your name</label><input id="me" placeholder="player"></div>
      </div>
      <label class="check"><input type="checkbox" id="strict"> Stick to the world facts (no invented names or places)</label>
      <div style="margin-top:12px"><button id="create">Create and talk</button></div>
    </section>
    <section>
      <h2>World facts</h2>
      <label for="lore">True for every character; they never contradict them. One per line.</label>
      <textarea id="lore" placeholder="The village is Brookmere.&#10;King Aldric died last winter."></textarea>
      <div style="margin-top:8px"><button class="ghost" id="savelore">Save facts</button><span class="saved" id="lorestate"></span></div>
    </section>
    <section>
      <h2>People</h2>
      <div id="people"><div class="empty">Nobody yet. Create someone above.</div></div>
    </section>
  </div>

  <section id="talkcol">
    <div id="who"><span class="empty">Create or pick a character to start talking.</span></div>
    <div id="log"></div>
    <div id="compose">
      <button class="icon" id="approach" title="Walk up to them: they speak first">👋</button>
      <input id="say" placeholder="Say something…" autocomplete="off" disabled>
      <button class="icon" id="mic" title="Talk with your voice">🎤</button>
      <button class="icon" id="voice" title="Hear them speak">🔈</button>
      <button id="send" disabled>Send</button>
    </div>
  </section>

  <div class="col" id="soulcol">
    <section>
      <h2>Soul</h2>
      <div id="soul"><div class="empty">Their inner life appears here: who they are, their mood, what they feel for you and remember.</div></div>
    </section>
    <section>
      <h2>Memories</h2>
      <div id="mems"><div class="empty">Nothing yet.</div></div>
    </section>
  </div>
</main>
<script>
const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
const headers = { "Content-Type": "application/json" };
if (token) { headers["Authorization"] = "Bearer " + token; document.getElementById("dash").href = "/#token=" + encodeURIComponent(token); }
const SESSION = "talk";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("kinloom-talk-" + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("kinloom-talk-" + k, JSON.stringify(v)); } catch (_) {} },
};

const LANGS = { English: "en", French: "fr", Spanish: "es", German: "de", Italian: "it", Portuguese: "pt", Japanese: "ja",
                Chinese: "zh", Korean: "ko", Russian: "ru", Polish: "pl", Dutch: "nl", Turkish: "tr", Arabic: "ar" };
const PRESETS = [
  ["Mira", "a widowed blacksmith, gruff and proud, who secretly sold the king's sword to pay her debts", "give(item), refuse_service"],
  ["Orrin", "an old lighthouse keeper who talks to the sea and hides a letter he never sent", "light_the_lamp, give(item)"],
  ["Juno", "a cocky rival pilot who pretends not to care but wants your respect", "challenge(race), share(tip)"],
  ["Pip", "a nervous shop robot that loves customers and fears being switched off", "sell(item, price), give(item)"],
];

let current = null, busy = false, online = false;
let voiceOn = store.get("voice", false);
let people = {};   // name -> {language, tools}

function setupForm() {
  const guess = Object.entries(LANGS).find(([, c]) => (navigator.language || "en").toLowerCase().startsWith(c));
  $("lang").innerHTML = Object.keys(LANGS).map((l) => `<option>${l}</option>`).join("");
  $("lang").value = store.get("lang", guess ? guess[0] : "English");
  $("me").value = store.get("me", "");
  $("presets").innerHTML = PRESETS.map(([n], i) => `<span class="chip" data-i="${i}">${esc(n)}</span>`).join("");
  $("presets").onclick = (e) => {
    const i = e.target.dataset.i; if (i == null) return;
    const [n, s, t] = PRESETS[+i]; $("name").value = n; $("soulseed").value = s; $("tools").value = t;
  };
  $("voice").classList.toggle("on", voiceOn);
  people = store.get("people", {});
}

async function post(verb, body) {
  const r = await fetch("/v1/" + verb, { method: "POST", headers, body: JSON.stringify(Object.assign({ session: SESSION }, body)) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
async function get(path) {
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "session=" + SESSION, { headers });
  return r.json();
}

function parseTools(text) {
  const tools = {};
  for (const part of (text || "").match(/[A-Za-z_][\w]*\s*(\([^)]*\))?/g) || []) {
    const m = part.match(/^([A-Za-z_]\w*)\s*(?:\(([^)]*)\))?$/);
    if (!m) continue;
    const args = {};
    for (const a of (m[2] || "").split(",").map((x) => x.trim()).filter(Boolean)) args[a] = a === "price" || a === "amount" ? 1 : "text";
    tools[m[1]] = args;
  }
  return tools;
}

async function status() {
  try {
    const s = await get("/v1/status");
    online = s.mode === "online";
    $("mode").textContent = online ? "real AI · " + s.provider + " · " + s.model : "offline (no model)";
    $("mode").className = "badge " + (online ? "online" : "offline");
    $("banner").style.display = online ? "none" : "block";
    $("banner").innerHTML = "No model found, so characters can only give their offline line. For real conversations set one key in " +
      "your environment and restart <code>kinloom</code>: <code>ANTHROPIC_API_KEY</code>, <code>DEEPSEEK_API_KEY</code>, " +
      "<code>OPENAI_API_KEY</code> or <code>OPENROUTER_API_KEY</code> (these two with <code>KINLOOM_MODEL</code>), or run Ollama.";
    const names = s.characters.map((c) => c.name);
    $("people").innerHTML = names.length ? s.characters.map((c) =>
      `<div class="person${c.name === current ? " on" : ""}" data-name="${esc(c.name)}"><div><b>${esc(c.name)}</b><small>${esc(c.personality)}</small></div></div>`).join("")
      : '<div class="empty">Nobody yet. Create someone above.</div>';
  } catch (e) { $("mode").textContent = "server not reachable"; $("mode").className = "badge offline"; }
}
$("people").onclick = (e) => { const p = e.target.closest(".person"); if (p) openChar(p.dataset.name, false); };

$("create").onclick = async () => {
  const name = $("name").value.trim(), seed = $("soulseed").value.trim();
  if (!name || !seed) { $("soulseed").focus(); return; }
  store.set("lang", $("lang").value); store.set("me", $("me").value.trim());
  const tools = parseTools($("tools").value);
  $("create").disabled = true;
  try {
    await post("character", { name, soul: seed, language: $("lang").value, tools, offline: "…", invent: !$("strict").checked });
    people[name] = { language: $("lang").value, tools };
    store.set("people", people);
    await openChar(name, true);
  } catch (e) { note("Could not create: " + e.message); }
  $("create").disabled = false;
  status();
};

async function openChar(name, fresh) {
  current = name;
  $("log").innerHTML = "";
  $("say").disabled = $("send").disabled = false;
  $("who").innerHTML = `<b>${esc(name)}</b><span class="mood" id="moodchip">…</span>`;
  status();
  const s = await refreshSoul();
  if (fresh) { approach(); return; }
  const lines = (s && s.conversation) || [];
  if (lines.length) note("Earlier:");
  for (const [who, text] of lines) bubble(who === name ? "npc" : "me", text);
  note(lines.length ? "You are back with " + name + "." : "You are with " + name + ". Say something, or 👋 to let them speak first.");
  $("say").focus();
}

function note(text, cls) {
  const d = document.createElement("div"); d.className = "note" + (cls ? " " + cls : ""); d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = 1e9;
}
function bubble(cls, text) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = 1e9; return d;
}

async function talk(message) {
  if (!current || busy) return;
  busy = true; $("send").disabled = true;
  const me = $("me").value.trim() || "player";
  if (message) bubble("me", message);
  const b = bubble("npc typing", "");
  let text = "", done = null, spoken = 0;
  try {
    const r = await fetch("/v1/chat", { method: "POST", headers,
      body: JSON.stringify({ session: SESSION, name: current, message, speaker: me, stream: true }) });
    if (!r.ok || !r.body) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.piece) {
          text += ev.piece; b.textContent = text; $("log").scrollTop = 1e9;
          let end = 0;                          // each finished sentence goes to the voice at once
          for (const m of text.matchAll(SENTENCE)) if (m.index + m[0].length > spoken) end = m.index + m[0].length;
          if (end) { speak(text.slice(spoken, end)); spoken = end; }
        }
        if (ev.done) done = ev;
      }
    }
  } catch (e) { note("Error: " + e.message); }
  b.classList.remove("typing");
  const final = done ? done.text : text;
  b.textContent = final || "…";
  if (done && done.mood) $("moodchip").textContent = done.mood;
  if (done && done.gesture) {
    const g = document.createElement("div"); g.className = "gesture"; g.textContent = "— " + done.gesture;
    $("log").appendChild(g); $("log").scrollTop = 1e9;
  }
  if (done && done.mood) currentMood = done.mood;
  if (final && final.startsWith(text.slice(0, spoken))) speak(final.slice(spoken));
  else if (final && !spoken) speak(final);
  try {
    const acts = await post("act", { name: current, think: false });
    for (const a of acts.actions || []) {
      const args = Object.entries(a.args || {}).map(([k, v]) => k + ": " + v).join(", ");
      note("⚡ " + current + " → " + a.tool + (args ? "(" + args + ")" : ""), "act");
    }
  } catch (_) {}
  busy = false; $("send").disabled = false;
  refreshSoul();
}
function approach() { talk(""); }
$("approach").onclick = approach;
$("send").onclick = () => { const m = $("say").value.trim(); if (m) { $("say").value = ""; talk(m); } };
$("say").onkeydown = (e) => { if (e.key === "Enter") $("send").onclick(); };

function list(title, items, secret) {
  if (!items || !items.length) return "";
  return `<div class="field"><b>${title}</b><ul>${items.map((x) => `<li${secret ? ' class="secret" title="hover to peek"' : ""}>${esc(x)}</li>`).join("")}</ul></div>`;
}
function text(title, value) { return value ? `<div class="field"><b>${title}</b>${esc(value)}</div>` : ""; }

let soulTimer = null;
async function refreshSoul() {
  if (!current) return;
  const me = $("me").value.trim() || "player";
  const s = await get("/v1/soul?name=" + encodeURIComponent(current) + "&speaker=" + encodeURIComponent(me));
  const bond = (s.bonds || {})[me];
  const c = s.card || {};
  const feel = bond ? bond.feeling : 0;
  const mood = s.mood || { word: "calm", level: 0 };
  if ($("moodchip")) $("moodchip").textContent = mood.word + (mood.level >= 0.7 ? " !!" : mood.level >= 0.35 ? " !" : "");
  $("soul").innerHTML =
    (s.ready ? "" : '<div class="writing">✎ writing their soul…</div>') +
    text("Who", c.summary || s.personality) + text("Voice", c.voice) + text("Past", c.backstory) +
    list("Cares about", c.values) + list("Wants", c.desires) + list("Trying to", c.goals) + list("Fears", c.fears) +
    list("Secrets", c.secrets, true) + list("Habits", c.quirks) + list("Likes", c.likes) + list("Dislikes", c.dislikes) +
    `<div class="field"><b>Mood</b>${esc(mood.word)}<div class="bar"><i style="left:0;width:${Math.round(mood.level * 100)}%"></i></div></div>` +
    `<div class="field"><b>Feeling for ${esc(me)}</b>${feel > 0.1 ? "likes you" : feel < -0.1 ? "dislikes you" : "neutral"} (${feel >= 0 ? "+" : ""}${feel.toFixed(2)})` +
    `<div class="bar"><i style="left:${feel >= 0 ? 50 : 50 + feel * 50}%;width:${Math.abs(feel) * 50}%;background:${feel >= 0 ? "var(--ok)" : "var(--bad)"}"></i></div></div>` +
    (bond ? text("Conversations with you", String(bond.talks)) : "") +
    ((s.tools || []).length ? text("Can do", s.tools.join(", ")) : "");
  const mems = (s.memories || []).slice().reverse();
  $("mems").innerHTML = mems.length ? mems.map((m) => `<div class="mem">${esc(m)}</div>`).join("") : '<div class="empty">Nothing yet.</div>';
  clearTimeout(soulTimer);
  if (!s.ready) soulTimer = setTimeout(refreshSoul, 1000);
  return s;
}

// ---------- voice: the server's voice (a voice key, or the system's), else the browser's own (free) ----------
const SENTENCE = /[.!?\u2026]+["'\u201d\u2019)\]]*\s+/g;
let lines = [], playing = false, audioNow = null;
function speak(text) {
  text = (text || "").trim();
  if (!voiceOn || !text || !current) return;
  const who = current;
  lines.push(post("speak", { name: who, text }).then((r) => (r && r.audio ? { url: "data:audio/wav;base64," + r.audio } : { text }), () => ({ text })));
  playNext();
}
async function playNext() {
  if (playing) return;
  playing = true;
  while (lines.length) {
    const line = await lines.shift();
    if (!voiceOn) break;
    if (line.url) {
      await new Promise((done) => { audioNow = new Audio(line.url); audioNow.onended = audioNow.onerror = done; audioNow.play().catch(done); });
      audioNow = null;
    } else if (line.text) await browserSay(line.text);
  }
  playing = false;
}
function stopSpeaking() {
  lines = [];
  if (audioNow) audioNow.pause();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function langCode() { return LANGS[(people[current] || {}).language || $("lang").value] || "en"; }
// The browser's best voices first (Edge "Natural", Chrome "Google", other neural voices), one per character, and a
// delivery that follows the mood.
function voiceScore(v) {
  const n = v.name.toLowerCase();
  return (/natural|neural/.test(n) ? 4 : 0) + (/online/.test(n) ? 2 : 0) + (/google/.test(n) ? 1 : 0) + (v.localService ? 0 : 1);
}
const MOOD_VOICE = { angry: [1.08, -0.1], furious: [1.12, -0.15], annoyed: [1.05, -0.05], irritated: [1.05, -0.05],
  sad: [0.88, -0.1], tired: [0.9, -0.08], afraid: [1.1, 0.1], nervous: [1.1, 0.08], happy: [1.05, 0.08],
  excited: [1.12, 0.12], cheerful: [1.05, 0.08], calm: [0.97, 0], wary: [0.97, -0.03], cold: [0.95, -0.1] };
let currentMood = "calm";
function browserSay(text) {
  return new Promise((done) => {
  if (!("speechSynthesis" in window)) return done();
  const u = new SpeechSynthesisUtterance(text);
  const code = langCode();
  const voices = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith(code));
  const best = voices.length ? Math.max(...voices.map(voiceScore)) : 0;
  const top = voices.filter((v) => voiceScore(v) === best);
  const h = hash(current || "");
  if (top.length) u.voice = top[h % top.length];
  const [rate, pitch] = MOOD_VOICE[currentMood] || [1, 0];
  u.lang = code; u.pitch = Math.max(0.5, 0.85 + (h % 30) / 100 + pitch); u.rate = rate;
  u.onend = u.onerror = () => done();
  speechSynthesis.speak(u);
  });
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();   // some browsers load the list on first ask
$("voice").onclick = () => { voiceOn = !voiceOn; store.set("voice", voiceOn); $("voice").classList.toggle("on", voiceOn); if (!voiceOn) stopSpeaking(); };
// Microphone: click to talk, click again to send. The recording goes to the server (its voice key, or the system's
// recognition); the browser's own recognition runs alongside and is used when the server heard nothing.
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
const canRecord = navigator.mediaDevices && typeof MediaRecorder !== "undefined";
if (!Rec && !canRecord) { $("mic").disabled = true; $("mic").title = "No microphone access in this browser"; }
let recorder = null, recognition = null, recognized = "";
function toBase64(blob) {
  return new Promise((ok) => { const f = new FileReader(); f.onload = () => ok(String(f.result).split(",")[1] || ""); f.readAsDataURL(blob); });
}
$("mic").onclick = async () => {
  if (!current) return;
  if (recorder) { if (recognition) try { recognition.stop(); } catch (_) {} recorder.stop(); return; }
  stopSpeaking();
  recognized = "";
  if (Rec) {
    recognition = new Rec(); recognition.lang = langCode(); recognition.interimResults = false;
    recognition.onresult = (e) => { recognized = Array.from(e.results).map((x) => x[0].transcript).join(" ").trim(); };
    recognition.onerror = () => {};
    try { recognition.start(); } catch (_) { recognition = null; }
  }
  if (!canRecord) {                            // only the browser's recognition: it sends when it hears the end
    $("mic").classList.add("on");
    recognition.onend = () => { $("mic").classList.remove("on"); if (recognized) talk(recognized); };
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach((track) => track.stop());
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      recorder = null; $("mic").classList.remove("on");
      let heard = "";
      if (blob.size > 2000) {
        try { heard = (await post("listen", { audio: await toBase64(blob), language: langCode() })).text || ""; } catch (_) {}
      }
      if (!heard && recognition) { await new Promise((r) => setTimeout(r, 400)); heard = recognized; }
      if (heard) talk(heard); else note("Nothing heard: try again closer to the microphone, or type.");
    };
    recorder.start();
    $("mic").classList.add("on");
  } catch (e) { recorder = null; note("Microphone: " + e.message); }
};

async function loadLore() {
  try { const r = await post("lore", {}); $("lore").value = (r.lore || []).join("\n"); } catch (_) {}
}
$("savelore").onclick = async () => {
  try {
    const r = await post("lore", { text: $("lore").value });
    $("lorestate").textContent = r.lines + " saved";
    setTimeout(() => ($("lorestate").textContent = ""), 2500);
  } catch (e) { $("lorestate").textContent = e.message; }
};

setupForm();
loadLore();
status(); setInterval(status, 4000);
</script>
