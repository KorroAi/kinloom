name: Release

# Push a tag such as v1.0.0: the wheel and one zip per engine are attached to a GitHub release.
# PyPI: configure a trusted publisher for this repository and workflow on pypi.org (environment "pypi"),
# then set the repository variable PUBLISH_PYPI to "true".

on:
  push:
    tags: ["v*"]

jobs:
  ci:                     # the whole CI (tests on 3 systems, every SDK, the wheel) must pass first
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --outdir dist python
      - run: python python/release.py dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Kinloom ${GITHUB_REF_NAME#v}" --generate-notes
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
